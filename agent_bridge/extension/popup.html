<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cight Agent</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #6c63ff;
      --accent-hover: #7c74ff;
      --text: #e0e0e0;
      --text-muted: #888;
      --success: #3ecf8e;
      --error: #ff5c72;
      --warning: #f59e0b;
      --step-bg: #12141e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 380px;
      min-height: 200px;
      padding: 16px;
      font-size: 13px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    header img { width: 28px; height: 28px; border-radius: 6px; }
    header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }

    #health-dot {
      margin-left: auto;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      title: "Checking server…";
    }
    #health-dot.ok    { background: var(--success); }
    #health-dot.error { background: var(--error); }

    /* ── Form ── */
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }

    textarea, input, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea:focus, input:focus, select:focus { border-color: var(--accent); }
    textarea { height: 80px; min-height: 60px; }
    select option { background: var(--surface); }

    .row { display: flex; gap: 8px; }
    .row .field { flex: 1; }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 8px; margin-top: 12px; }
    button {
      flex: 1;
      padding: 9px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #runBtn  { background: var(--accent); color: #fff; }
    #runBtn:hover:not(:disabled) { background: var(--accent-hover); }
    #clearBtn { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); flex: 0 0 auto; padding: 9px 12px; }
    #clearBtn:hover:not(:disabled) { color: var(--text); }

    /* ── Status / Output ── */
    #output { margin-top: 14px; }

    .status-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .status-bar.visible { display: flex; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #statusText { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

    /* ── Steps log ── */
    #stepsLog {
      display: none;
      max-height: 160px;
      overflow-y: auto;
      background: var(--step-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 11px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
    }
    #stepsLog.visible { display: block; }
    .step-line { color: var(--text-muted); line-height: 1.6; }
    .step-line span.n { color: var(--accent); margin-right: 4px; }
    .step-line span.act { color: var(--text); }

    /* ── Result card ── */
    #resultCard {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
    }
    #resultCard.visible { display: block; }
    #resultCard .result-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    #resultCard .result-header .badge {
      font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; text-transform: uppercase;
    }
    .badge.success { background: #1a3d2f; color: var(--success); }
    .badge.failure { background: #3d1a1f; color: var(--error); }
    .badge.error   { background: #3d1a1f; color: var(--error); }

    #resultCard .meta { font-size: 10px; color: var(--text-muted); margin-left: auto; }
    #resultText { font-size: 12px; color: var(--text); line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow-y: auto; }
  </style>
</head>
<body>
  <header>
    <img src="icon48.png" alt="Cight" />
    <h1>Cight Agent</h1>
    <div id="health-dot" title="Checking server…"></div>
  </header>

  <div class="field">
    <label>Task</label>
    <textarea id="task" placeholder="e.g. Go to my Gmail and summarize unread emails from today"></textarea>
  </div>

  <div class="row">
    <div class="field">
      <label>Model</label>
      <select id="model">
        <optgroup label="Groq (fast &amp; free)">
          <option value="llama-3.3-70b-versatile" selected>llama-3.3-70b-versatile</option>
          <option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>
          <option value="compound-beta">compound-beta</option>
        </optgroup>
        <optgroup label="Gemini">
          <option value="gemini-2.0-flash">gemini-2.0-flash</option>
          <option value="gemini-2.5-flash">gemini-2.5-flash</option>
          <option value="gemini-2.5-pro">gemini-2.5-pro</option>
        </optgroup>
        <optgroup label="Claude">
          <option value="claude-sonnet-4-6">claude-sonnet-4-6</option>
          <option value="claude-haiku-3-5">claude-haiku-3-5</option>
        </optgroup>
      </select>
    </div>
    <div class="field">
      <label>Max steps</label>
      <input id="maxSteps" type="number" value="25" min="1" max="100" />
    </div>
  </div>

  <div class="btn-row">
    <button id="runBtn">▶ Run task</button>
    <button id="clearBtn" title="Clear output">✕</button>
  </div>

  <div id="output">
    <div class="status-bar" id="statusBar">
      <div class="spinner" id="spinner"></div>
      <span id="statusText">Starting agent…</span>
    </div>

    <div id="stepsLog"></div>

    <div id="resultCard">
      <div class="result-header">
        <span class="badge" id="resultBadge">done</span>
        <span class="meta" id="resultMeta"></span>
      </div>
      <div id="resultText"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
