<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cight Agent</title>
  <style>
    :root {
      --bg:           #0f1117;
      --surface:      #1a1d27;
      --surface2:     #21253a;
      --border:       #2a2d3a;
      --accent:       #6c63ff;
      --accent-hover: #7c74ff;
      --accent-dim:   #6c63ff22;
      --text:         #e0e0e0;
      --text-muted:   #777;
      --success:      #3ecf8e;
      --error:        #ff5c72;
      --step-bg:      #12141e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    /* ── Layout shell ── */
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header img { width: 26px; height: 26px; border-radius: 6px; }
    header h1  { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }

    #health-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }
    #health-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }
    #health-dot.ok    { background: var(--success); }
    #health-dot.error { background: var(--error); }
    #health-label { font-size: 10px; }

    /* ── Scrollable body ── */
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    textarea, input, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea { resize: vertical; height: 90px; min-height: 60px; }
    textarea:focus, input:focus, select:focus { border-color: var(--accent); }
    select option { background: var(--surface); }

    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 9px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #runBtn  { background: var(--accent); color: #fff; }
    #runBtn:hover:not(:disabled) { background: var(--accent-hover); }
    #clearBtn {
      flex: 0 0 auto;
      padding: 9px 13px;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    #clearBtn:hover:not(:disabled) { color: var(--text); }

    /* ── Status bar ── */
    .status-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .status-bar.visible { display: flex; }
    .spinner {
      width: 13px; height: 13px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #statusText {
      font-size: 12px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    /* ── Steps log ── */
    #stepsLog {
      display: none;
      background: var(--step-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-size: 11.5px;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      max-height: 300px;
      overflow-y: auto;
    }
    #stepsLog.visible { display: block; }
    .step-line { line-height: 1.7; color: var(--text-muted); }
    .step-line .n   { color: var(--accent); margin-right: 4px; }
    .step-line .act { color: var(--text); }
    .step-line .tag {
      display: inline-block;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--accent-dim);
      color: var(--accent);
      margin-right: 4px;
    }

    /* ── Result card ── */
    #resultCard {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    #resultCard.visible { display: block; }
    .result-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .badge {
      font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .badge.success { background: #1a3d2f; color: var(--success); }
    .badge.error   { background: #3d1a1f; color: var(--error); }
    .result-meta { font-size: 10px; color: var(--text-muted); margin-left: auto; }
    #resultText {
      padding: 12px;
      font-size: 12.5px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      max-height: 300px;
      overflow-y: auto;
    }

    /* ── History section ── */
    #historySection { display: none; }
    #historySection.visible { display: block; }
    .history-header {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
    }
    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .history-item:hover { border-color: var(--accent); }
    .history-item .hi-task { font-size: 12px; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item .hi-meta { font-size: 10px; color: var(--text-muted); }
    .history-item .hi-badge { display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; text-transform: uppercase; margin-right: 4px; }
    .hi-badge.success { background: #1a3d2f; color: var(--success); }
    .hi-badge.error   { background: #3d1a1f; color: var(--error); }

    /* ── Divider ── */
    .divider { border: none; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <img src="icon48.png" alt="Cight" />
    <h1>Cight Agent</h1>
    <div id="health-wrap">
      <div id="health-dot" title="Checking…"></div>
      <span id="health-label">checking…</span>
    </div>
  </header>

  <!-- Scrollable content -->
  <div class="panel-body">

    <!-- Task input -->
    <div>
      <label>Task</label>
      <textarea id="task" placeholder="e.g. Open YouTube and play the first trending video"></textarea>
    </div>

    <!-- Model + Max steps -->
    <div class="row">
      <div>
        <label>Model</label>
        <select id="model">
          <optgroup label="Groq (fast &amp; free)">
            <option value="llama-3.3-70b-versatile" selected>llama-3.3-70b</option>
            <option value="llama-3.1-8b-instant">llama-3.1-8b</option>
            <option value="compound-beta">compound-beta</option>
          </optgroup>
          <optgroup label="Gemini">
            <option value="gemini-2.0-flash">gemini-2.0-flash</option>
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
            <option value="gemini-2.5-pro">gemini-2.5-pro</option>
          </optgroup>
          <optgroup label="Claude">
            <option value="claude-sonnet-4-6">claude-sonnet-4-6</option>
            <option value="claude-haiku-3-5">claude-haiku-3-5</option>
          </optgroup>
        </select>
      </div>
      <div>
        <label>Max steps</label>
        <input id="maxSteps" type="number" value="25" min="1" max="100" />
      </div>
    </div>

    <!-- Buttons -->
    <div class="btn-row">
      <button id="runBtn">▶&nbsp; Run task</button>
      <button id="clearBtn" title="Clear output">✕</button>
    </div>

    <!-- Status bar -->
    <div class="status-bar" id="statusBar">
      <div class="spinner"></div>
      <span id="statusText">Starting…</span>
    </div>

    <!-- Steps log -->
    <div id="stepsLog"></div>

    <!-- Result -->
    <div id="resultCard">
      <div class="result-header">
        <span class="badge" id="resultBadge">done</span>
        <span class="result-meta" id="resultMeta"></span>
      </div>
      <div id="resultText"></div>
    </div>

    <!-- Divider + History -->
    <hr class="divider" id="historyDivider" style="display:none" />
    <div id="historySection">
      <div class="history-header">Recent tasks</div>
      <div id="historyList"></div>
    </div>

  </div><!-- /.panel-body -->

  <script src="sidepanel.js"></script>
</body>
</html>
